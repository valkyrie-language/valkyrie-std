name: 自举验证

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      previous_version:
        description: '上一代编译器版本号（留空则使用最新）'
        required: false
        type: string

env:
  DOTNET_VERSION: '10.0'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Seed：构建上一代 legion CLI
  # ─────────────────────────────────────────────────────────────
  build-legion:
    name: 构建上一代 legion CLI
    runs-on: ubuntu-latest
    outputs:
      legion-path: ${{ steps.legion.outputs.path }}
    steps:
      - name: 检出 valkyrie.v
        uses: actions/checkout@v4
        with:
          path: valkyrie.v

      - name: 检出 NyarVM.cs
        uses: actions/checkout@v4
        with:
          repository: oovm/NyarVM.cs
          path: NyarVM.cs
          ref: master

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 构建 legion CLI
        working-directory: valkyrie.v
        run: |
          dotnet publish ../NyarVM.cs/tools/legion/Legion.CLI.csproj \
            -c Release \
            --nologo \
            -o ./dist/legion \
            -p:UseAppHost=true

      - name: 记录 legion 路径
        id: legion
        run: |
          echo "path=$(pwd)/valkyrie.v/dist/legion/legion" >> $GITHUB_OUTPUT

      - name: 上传 legion 产物
        uses: actions/upload-artifact@v4
        with:
          name: legion-cli
          path: valkyrie.v/dist/legion/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # 源头自举：seed -> v1.clr -> v2.clr
  # ─────────────────────────────────────────────────────────────
  bootstrap-clr-source:
    name: CLR 源头自举验证
    runs-on: ubuntu-latest
    needs: build-legion
    steps:
      - name: 检出 valkyrie.v
        uses: actions/checkout@v4
        with:
          path: valkyrie.v

      - name: 检出 NyarVM.cs
        uses: actions/checkout@v4
        with:
          repository: oovm/NyarVM.cs
          path: NyarVM.cs
          ref: master

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 下载 legion CLI
        uses: actions/download-artifact@v4
        with:
          name: legion-cli
          path: ./legion

      - name: 赋予执行权限
        run: chmod +x ./legion/legion

      - name: 运行 CLR 自举验证
        working-directory: valkyrie.v
        env:
          LEGION_PATH: ${{ github.workspace }}/legion/legion
        run: |
          node scripts/bootstrap-clr.mjs --verbose

      - name: 上传自举报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-clr-report
          path: valkyrie.v/dist/bootstrap-clr/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Node 轨：seed -> v1.node -> v2.node（npm / JSR 发布门）
  # ─────────────────────────────────────────────────────────────
  bootstrap-node-source:
    name: Node 源头自举验证（npm / JSR）
    runs-on: ubuntu-latest
    needs: build-legion
    steps:
      - name: 检出 valkyrie.v
        uses: actions/checkout@v4
        with:
          path: valkyrie.v

      - name: 检出 NyarVM.cs
        uses: actions/checkout@v4
        with:
          repository: oovm/NyarVM.cs
          path: NyarVM.cs
          ref: master

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载 legion CLI
        uses: actions/download-artifact@v4
        with:
          name: legion-cli
          path: ./legion

      - name: 赋予执行权限
        run: chmod +x ./legion/legion

      - name: 运行 Node 自举验证
        working-directory: valkyrie.v
        env:
          LEGION_PATH: ${{ github.workspace }}/legion/legion
        run: |
          node scripts/bootstrap-node.mjs --verbose

      - name: 上传自举报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-node-report
          path: valkyrie.v/dist/bootstrap-node/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 汇总判定
  # ─────────────────────────────────────────────────────────────
  gate:
    name: 汇总判定
    runs-on: ubuntu-latest
    needs:
      - build-legion
      - bootstrap-clr-source
      - bootstrap-node-source
    if: always()

    steps:
      - name: 打印自举验证结果
        run: |
          {
            echo "## 自举验证结果"
            echo ""
            echo "### Seed 阶段"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "|------|------|"
            echo "| 上一代 legion CLI | ${{ needs.build-legion.result }} |"
            echo ""
            echo "### CLR 源头自举（NuGet）"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "|------|------|"
            echo "| seed -> v1 -> v2 | ${{ needs.bootstrap-clr-source.result }} |"
            echo ""
            echo "### Node 源头自举（npm / JSR）"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "|------|------|"
            echo "| seed -> v1.node -> v2.node | ${{ needs.bootstrap-node-source.result }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 判定
        run: |
          if [ "${{ needs.build-legion.result }}" != "success" ]; then
            echo "上一代 legion CLI 未构建成功"
            exit 1
          fi
          if [ "${{ needs.bootstrap-clr-source.result }}" != "success" ]; then
            echo "CLR 源头自举未通过（阻断 NuGet 发布）"
            exit 1
          fi
          if [ "${{ needs.bootstrap-node-source.result }}" != "success" ]; then
            echo "Node 源头自举未通过（阻断 npm / JSR 发布）"
            exit 1
          fi
          echo "CLR 与 Node 双轨自举均已通过"
