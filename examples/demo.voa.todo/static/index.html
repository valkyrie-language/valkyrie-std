<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOA Admin - 后台管理系统</title>
    <style>
        :root {
            --voa-bg: #0d1117;
            --voa-card: #161b22;
            --voa-border: #21262d;
            --voa-text: #e6edf3;
            --voa-text-secondary: #8b949e;
            --voa-text-tertiary: #6e7681;
            --voa-accent: #58a6ff;
            --voa-accent-subtle: rgba(56, 139, 253, 0.15);
            --voa-hover: #161b22;
            --voa-active: #1c2333;
            --voa-success: #3fb950;
            --voa-warning: #d29922;
            --voa-error: #da3633;
            --voa-radius-md: 6px;
            --voa-radius-xl: 12px;
            --voa-transition-fast: 0.15s;
            --voa-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--voa-bg);
            color: var(--voa-text);
        }

        #app-loading {
            text-align: center;
            padding: 40px;
            color: var(--voa-text-secondary);
        }
    </style>
</head>
<body>
    <!-- 应用挂载点，运行时会把 WASM 应用渲染到此处 -->
    <div id="app">
        <p id="app-loading">正在加载 VOA Admin...</p>
    </div>

    <!-- 加载 VOA 运行时 -->
    <script src="voa-runtime.js"></script>

    <!-- 自动引导脚本：autoBoot 会扫描此标签并加载 WASM 模块 -->
    <script
        data-voa-app="voa-admin"
        data-wasm-url="app.wasm"
        data-glue-url="app.mjs"
        data-app-url="app.mjs">
    </script>
</body>
</html>
