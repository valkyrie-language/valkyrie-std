<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>demo - Test Report</title>
  <style>
    /* inlined base + page CSS (real build merges AWSL scoped styles similarly) */
  </style>
  <link rel="stylesheet" href="legion-test.css">
</head>
<body>
  <div class="report-layout">
    <header class="report-header">
      <h1 class="report-title">demo - Test Report</h1>
    </header>
    <div class="report-body">
      <!-- SSG: voa::ssg 静态渲染 test-report.awsl + JSON 数据 -->
      <div class="summary">
        <div class="summary-card pass"><div class="count">2</div><div class="label">通过</div></div>
        <div class="summary-card fail"><div class="count">1</div><div class="label">失败</div></div>
        <div class="summary-card skip"><div class="count">0</div><div class="label">跳过</div></div>
      </div>
      <div class="chart-grid">
        <div class="chart-panel">
          <!-- hydrate 岛：report_build 注入的 mount 点 -->
          <div data-island="hydrated" data-component="chart-status" data-module="legion-test"></div>
        </div>
      </div>
      <table class="report-table">
        <thead>
          <tr><th>测试名称</th><th>状态</th><th>目标平台</th><th>错误信息</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>add</td>
            <td><span class="status-badge pass">通过</span></td>
            <td>nyar</td>
            <td></td>
          </tr>
          <tr>
            <td>sub</td>
            <td><span class="status-badge fail">失败</span></td>
            <td>nyar</td>
            <td>boom</td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer class="report-footer"><p>Generated by Legion CLI</p></footer>
  </div>
  <script src="boot.js"></script>
</body>
</html>
